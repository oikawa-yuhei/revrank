name: Hourly Fetch & Build

on:
  schedule:
    - cron: '0 * * * *'   # 毎時0分に実行
  workflow_dispatch:        # 手動実行ボタン

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install requests python-dotenv

      - name: Fetch rankings
        run: python fetch_ranking.py
        env:
          RAKUTEN_ICHIBA_APP_ID:     ${{ secrets.RAKUTEN_ICHIBA_APP_ID }}
          RAKUTEN_ICHIBA_ACCESS_KEY: ${{ secrets.RAKUTEN_ICHIBA_ACCESS_KEY }}
          RAKUTEN_ORIGIN:            ${{ secrets.RAKUTEN_ORIGIN }}

      - name: Build site
        run: python build_site.py
        env:
          RAKUTEN_ICHIBA_APP_ID: ${{ secrets.RAKUTEN_ICHIBA_APP_ID }}

      - name: Commit & push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ data/ichiba_ranking.db data/img_cache/
          git diff --staged --quiet || git commit -m "chore: auto update $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
