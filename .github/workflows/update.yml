name: Hourly Fetch & Build

on:
  schedule:
    - cron: '0 * * * *'   # 毎時0分に実行
  workflow_dispatch:        # 手動実行ボタン

# 同時実行を防ぐ: 前のジョブが実行中なら待機 (キャンセルしない)
concurrency:
  group: update-job
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25   # 31ジャンル×画像取得を考慮して延長

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1   # 最新コミットのみ取得

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install requests python-dotenv

      - name: Fetch rankings (全31ジャンル)
        run: python fetch_ranking.py
        env:
          RAKUTEN_ICHIBA_APP_ID:     ${{ secrets.RAKUTEN_ICHIBA_APP_ID }}
          RAKUTEN_ICHIBA_ACCESS_KEY: ${{ secrets.RAKUTEN_ICHIBA_ACCESS_KEY }}
          RAKUTEN_ORIGIN:            ${{ secrets.RAKUTEN_ORIGIN }}

      - name: Build site
        run: python build_site.py
        env:
          RAKUTEN_ICHIBA_APP_ID: ${{ secrets.RAKUTEN_ICHIBA_APP_ID }}

      - name: Commit & push (リトライ付き)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ data/ichiba_ranking.db data/img_cache/
          git diff --staged --quiet && echo "変更なし、スキップ" && exit 0
          git commit -m "chore: auto update $(date -u '+%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            echo "Push失敗 (${i}/3)、5秒後リトライ..."
            sleep 5
          done
