name: Daily BuySignal

on:
  schedule:
    - cron: '30 2 * * *'   # 毎日 02:30 UTC (= 11:30 JST) ← fetch_mentions の30分後
  workflow_dispatch:

concurrency:
  group: fetch-buysignal
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  buysignal:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 feedparser python-dotenv

      - name: Run BuySignal batch
        run: python fetch_buysignal.py
        env:
          RAKUTEN_ICHIBA_APP_ID:     ${{ secrets.RAKUTEN_ICHIBA_APP_ID }}
          RAKUTEN_ICHIBA_ACCESS_KEY: ${{ secrets.RAKUTEN_ICHIBA_ACCESS_KEY }}
          RAKUTEN_ORIGIN:            ${{ secrets.RAKUTEN_ORIGIN }}
          RAKUTEN_AFFILIATE_ID:      ${{ secrets.RAKUTEN_AFFILIATE_ID }}

      - name: Commit & push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ichiba_ranking.db data/buysignal_state.json
          git diff --staged --quiet && echo "変更なし、スキップ" && exit 0
          git commit -m "chore: buysignal $(date -u '+%Y-%m-%d')"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            echo "Push失敗 (${i}/3)、5秒後リトライ..."
            sleep 5
          done
